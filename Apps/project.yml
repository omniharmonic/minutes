name: Minutes
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "18.0"
packages:
  MinutesKit:
    path: ../MinutesKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "55"
    DEVELOPMENT_TEAM: 83Y42N33H8
    GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.618880165655-h7cgl66bg5i3539cv8npvthhp9i53uhk
targets:
  MinutesiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: MinutesiOS
      - path: Shared/Licenses
        type: folder
        buildPhase: resources
      - path: Shared/Assets.xcassets
        buildPhase: resources
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../MinutesKit/Sources/MinutesApp/AppState.swift
      - path: ../MinutesKit/Sources/MinutesApp/MeetingMarkdownDocument.swift
      - path: ../MinutesKit/Sources/MinutesApp/FolderLibrary.swift
    dependencies:
      - package: MinutesKit
        product: MinutesCore
      - package: MinutesKit
        product: MinutesSpeech
      - package: MinutesKit
        product: MinutesSpeakerID
      - package: MinutesKit
        product: MinutesCalendar
      - package: MinutesKit
        product: MinutesSummarize
      - package: MinutesKit
        product: MinutesExport
      - package: MinutesKit
        product: MinutesUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.minutes.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: MinutesiOS/Info.plist
      properties:
        GoogleDesktopClientID: 618880165655-s4ct030bbuqbti3cqlkt6jsdtqf77lve.apps.googleusercontent.com
        GoogleIOSClientID: 618880165655-h7cgl66bg5i3539cv8npvthhp9i53uhk.apps.googleusercontent.com
        CFBundleDisplayName: Minutes
        CFBundleURLTypes:
          - CFBundleURLName: Google Calendar
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
          - CFBundleURLName: Minutes authentication
            CFBundleURLSchemes:
              - minutes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Record meeting audio on this device when you tap Record.
        NSSpeechRecognitionUsageDescription: Transcribe saved meeting audio using on-device speech recognition.
        NSCalendarsFullAccessUsageDescription: Connect meetings and invitees from the calendars you configure on this device.
        NSCalendarsUsageDescription: Connect meetings from calendars configured on this device.
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  MinutesiOS:
    build:
      targets:
        MinutesiOS: all
    run:
      config: Debug
    archive:
      config: Release
